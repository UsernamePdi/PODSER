<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pokedex dos manos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body class="bg-light">
  <main class="container py-5">
    <h1 class="text-center mb-4"> Pokedex AURA</h1>
    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-5">
        <form id="pokemon-form" class="input-group mb-3">
          <input type="text" id="pokemon-input" class="form-control"
                 placeholder="Nome do bixu" autocomplete="off">
          <button type="submit" class="btn btn-primary">Buscar</button>
        </form>
        <div id="mensagem" role="alert"></div>
      </div>
    </div>
    <div class="row justify-content-center">
      <div class="col-12 col-sm-8 col-md-6 col-lg-4">
        <div id="pokemon-card" class="card shadow d-none text-center">
          <img id="pokemon-img" class="card-img-top p-3" alt="Imagem do Pokémon">
          <div class="card-body">
            <h2 id="pokemon-nome" class="card-title text-capitalize"></h2>
            <div id="pokemon-tipos" class="mb-3"></div>
          </div>
          <ul id="pokemon-stats" class="list-group list-group-flush"></ul>
        </div>
      </div>
    </div>
  </main>
  <script src="script (1).js"></script>
</body>
</html>
